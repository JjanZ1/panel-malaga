<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SERVEO MALAGA LOG</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f4f4;
    color:#222;
    font-family:Segoe UI, Arial, sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    background:#FF5A00;
    color:white;
    padding:25px;
    text-align:center;
}

.header h1{
    font-size:60px;
}

.fecha{
    margin-top:10px;
    font-size:28px;
}

.reloj{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:130px;
    font-weight:bold;
    color:#FF5A00;
    background:white;
}

.panel-tiempo{
    background:white;
    border-top:8px solid #FF5A00;
    padding:25px;
    text-align:center;
}

.panel-tiempo h2{
    color:#FF5A00;
    font-size:38px;
    margin-bottom:15px;
}

.panel-tiempo p{
    font-size:30px;
    margin:8px;
}

.footer{
    background:#FF5A00;
    color:white;
    text-align:center;
    padding:10px;
    font-size:18px;
}
</style>

</head>

<body>

<div class="header">
    <h1>SERVEO MALAGA LOG</h1>
    <div id="fecha" class="fecha"></div>
</div>

<div id="hora" class="reloj">
    --:--:--
</div>

<div class="panel-tiempo">

    <h2>PREVISIÓN DEL TIEMPO</h2>

    <p id="temperatura">Cargando...</p>

    <p id="estado"></p>

    <p id="viento"></p>

</div>

<div class="footer">
    Málaga María Zambrano
</div>

<script>

function actualizarHora(){

    const ahora = new Date();

    document.getElementById("hora").textContent =
        ahora.toLocaleTimeString("es-ES");

    document.getElementById("fecha").textContent =
        ahora.toLocaleDateString("es-ES", {
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        });

}

async function cargarTiempo(){

    try{

        const respuesta = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=36.7213&longitude=-4.4214&current_weather=true"
        );

        if(!respuesta.ok){
            throw new Error("HTTP " + respuesta.status);
        }

        const datos = await respuesta.json();

        document.getElementById("temperatura").textContent =
            "🌡️ " + datos.current_weather.temperature + " °C";

        document.getElementById("viento").textContent =
            "💨 Viento: " + datos.current_weather.windspeed + " km/h";

        let estado = "Información meteorológica";

        switch(datos.current_weather.weathercode){

            case 0:
                estado = "☀️ Despejado";
                break;

            case 1:
            case 2:
            case 3:
                estado = "⛅ Parcialmente nuboso";
                break;

            case 45:
            case 48:
                estado = "🌫️ Niebla";
                break;

            case 51:
            case 53:
            case 55:
                estado = "🌦️ Llovizna";
                break;

            case 61:
            case 63:
            case 65:
                estado = "🌧️ Lluvia";
                break;

            case 71:
            case 73:
            case 75:
                estado = "❄️ Nieve";
                break;

            case 95:
                estado = "⛈️ Tormenta";
                break;

        }

        document.getElementById("estado").textContent =
            estado;

    }
    catch(error){

        document.getElementById("temperatura").textContent =
            "❌ ERROR API";

        document.getElementById("estado").textContent =
            error.message;

        document.getElementById("viento").textContent =
            "";

    }

}

actualizarHora();
cargarTiempo();

setInterval(actualizarHora,1000);
setInterval(cargarTiempo,600000);

</script>

</body>
</html>
